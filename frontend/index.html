<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend</title>
  </head>
  <body>
    <div id="app">
      <!-- initial splash shown until Vue mounts and validates auth -->
      <div id="initial-splash" style="width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;background:#0f1724;color:white;">
        <div style="text-align:center;">
          <div style="font-size:2rem;margin-bottom:1rem">Loading...</div>
          <div style="width:48px;height:48px;border:4px solid rgba(255,255,255,0.15);border-top-color:#ffd700;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
    <style>
      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
  </body>
</html>
